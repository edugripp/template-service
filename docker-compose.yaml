version: '3.9'

services:
  db-mysql:
    container_name: db-mysql
    image: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: db
    volumes:
      - ~/data/mysql-data:/var/lib/mysql
    ports:
      - 3306:3306


  template:
    container_name: template
    depends_on:
      - db-mysql    
    image:  docker.io/egripp/spring3-native-template/template-service:1.0.0
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - 9090:9090


volumes:
  mysql-data:

  